    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600;700;800&display=swap');

        :root {
            --vietri-blue: #0047AB;
            --vietri-yellow: #FFD700;
            --vietri-white: #F8F9FA;
            --vietri-dark: #002244;
        }

        body {
            background-color: var(--vietri-white);
            font-family: 'Montserrat', sans-serif;
            color: #333;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .font-serif { font-family: 'Cinzel', serif; }

        .font-reading { font-family: 'Lora', serif; }

        /* Sfondi Ceramica e Maiolica */

        .bg-ceramic {
            background-color: var(--vietri-white);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        }

        .maiolica-border {
            border: 6px solid var(--vietri-blue);
            background-image:
                linear-gradient(45deg, var(--vietri-blue) 25%, transparent 25%, transparent 75%, var(--vietri-blue) 75%, var(--vietri-blue)),
                linear-gradient(45deg, var(--vietri-blue) 25%, transparent 25%, transparent 75%, var(--vietri-blue) 75%, var(--vietri-blue));
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            box-shadow: 0 10px 25px rgba(0, 71, 171, 0.15);
            background-color: white;
        }

        .maiolica-content {
            background: rgba(255, 255, 255, 0.88);
            border: 2px solid var(--vietri-yellow);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--vietri-yellow) 0%, #D4AF37 100%);
            color: var(--vietri-dark);
            border: 3px solid white;
            padding: 16px 40px;
            font-size: 1.25rem;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-start:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 25px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .physical-card {
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: white;
            border: 1px solid #e0e0e0;
        }

        .physical-card:hover {
            transform: translateY(-6px) rotate(1deg);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
        }

        .vietri-card {
            background: white;
            border: 2px solid var(--vietri-blue);
            border-radius: 14px;
            box-shadow: 3px 3px 0px rgba(0, 71, 171, 0.18);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* --- ANIMAZIONI GUIDA INTERATTIVA --- */

        @keyframes pulseGlowWorker {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.8), 0 2px 5px rgba(0,0,0,0.1);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(234, 179, 8, 0), 0 6px 14px rgba(234, 179, 8, 0.4);
                transform: scale(1.06);
            }
        }

        .highlight-worker {
            animation: pulseGlowWorker 1.8s infinite ease-in-out;
            border-color: #f59e0b !important;
            background-color: #fefce8 !important;
        }

        @keyframes pulseGlowZone {
            0%, 100% {
                box-shadow: 0 0 10px rgba(234, 179, 8, 0.7);
                border-color: #f59e0b;
                transform: scale(1.02);
            }
            50% {
                box-shadow: 0 0 22px rgba(234, 179, 8, 0.95), 0 0 10px rgba(255, 255, 255, 0.8);
                border-color: #fbbf24;
                transform: scale(1.07);
            }
        }

        .highlight-zone {
            animation: pulseGlowZone 1.5s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulseEndDay {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(17, 24, 39, 0.7);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0), 0 4px 15px rgba(245, 158, 11, 0.6);
                transform: scale(1.02);
            }
        }

        .highlight-endday {
            animation: pulseEndDay 1.6s infinite ease-in-out;
            border: 2px solid #f59e0b !important;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
        }

        @keyframes guideBannerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .guide-banner-anim {
            animation: guideBannerBounce 2s ease-in-out infinite;
        }

        /* --- ANIMAZIONE ASINELLO CHE CAMMINA E TRACCIATO PUNTI IN CELEBRAZIONE --- */

        @keyframes donkeyTrot {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(3deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-3px) rotate(-3deg); }
        }

        .donkey-walking {
            animation: donkeyTrot 0.45s infinite ease-in-out;
            filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.8));
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scoreTrackBurst {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.9);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 28px 8px rgba(245, 158, 11, 0.7), inset 0 0 18px rgba(254, 240, 138, 0.8);
                transform: scale(1.02);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
                transform: scale(1);
            }
        }

        .score-celebrating {
            animation: scoreTrackBurst 1.6s infinite ease-in-out;
            border-color: #f59e0b !important;
        }

        /* PULSAZIONE BAGLIORE ALLINEAMENTO SUL TORNIO */

        @keyframes latheAlignmentPulse {
            0%, 100% {
                filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.7));
                stroke: #22c55e;
            }
            50% {
                filter: drop-shadow(0 0 14px rgba(34, 197, 94, 1));
                stroke: #4ade80;
            }
        }

        .lathe-aligned-highlight {
            animation: latheAlignmentPulse 1.4s infinite ease-in-out;
        }

        /* ANIMAZIONE ROTAZIONE TORNIO */

        @keyframes latheSpinImpulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.035); filter: brightness(1.15) drop-shadow(0 0 16px rgba(245, 158, 11, 0.5)); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .lathe-spin-active {
            animation: latheSpinImpulse 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hero Animation */

        @keyframes kenBurns {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.08) translate(-1%, -1%); }
            100% { transform: scale(1) translate(0, 0); }
        }

        .animate-ken-burns {
            animation: kenBurns 25s ease-in-out infinite alternate;
        }

        /* --- TORNIO ANTICO IN LEGNO E TERRACOTTA --- */

        .antique-workshop-panel {
            background: radial-gradient(circle at center, #fdf6ec 0%, #f4e8da 60%, #e8d5be 100%);
            border: 2px solid #b48a5c;
        }

        .lathe-svg-container {
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
        }

        .lathe-inner-disc {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 150px 150px;
        }

        /* Tracciato Punti Compatto */

        .score-tile {
            transition: all 0.25s ease;
        }

        .score-tile.active-score {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            transform: scale(1.12);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
            z-index: 10;
        }

        /* Pedina Meeple Artigiana in Legno */

        .meeple-artisan {
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
            transition: all 0.25s ease;
        }

        .meeple-button {
            transition: all 0.25s ease;
        }

        .meeple-button.selected {
            outline: 3px solid #f59e0b;
            transform: scale(1.06) translateY(-2px);
            background-color: #fef9c3 !important;
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
        }

        .meeple-button.used {
            opacity: 0.4;
            filter: grayscale(85%);
            cursor: not-allowed;
        }

        /* Mappa Grafica con Illustrazione Autentica del Tabellone */

        .board-map-artwork {
            background-image: url('/Vietri-BoardGame/assets/tabellone-B5zyBruV.jpg');
            background-size: cover;
            background-position: center;
            border: 3px solid var(--vietri-blue);
            box-shadow: 0 8px 25px rgba(0, 71, 171, 0.2);
        }

        .map-station {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(4px);
        }

        .map-station:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

        // Calcolo allineamenti: Ogni settore interno (120°) corrisponde a 2 settori colore esterni (60° ciascuno)
        function getAlignedSections() {
            const rot = (gameState.innerRotationIndex % 3 + 3) % 3;
            return [0, 1, 2].map(innerIdx => {
                const out1 = (innerIdx * 2 + rot * 2) % 6;
                const out2 = (innerIdx * 2 + rot * 2 + 1) % 6;
                const slotIn = gameState.innerSlots[innerIdx];
                const slotOut1 = gameState.outerSlots[out1];
                const slotOut2 = gameState.outerSlots[out2];
                
                const combinedColors = {};
                COLORS.forEach(c => {
                    combinedColors[c] = (slotOut1[c] || 0) + (slotOut2[c] || 0);
                });

                return {
                    innerIndex: innerIdx,
                    innerSlot: slotIn,
                    outerIndices: [out1, out2],
                    outerSlots: [slotOut1, slotOut2],
                    combinedColors: combinedColors
                };
            });
        }
        window.getAlignedSections = getAlignedSections;

        // Trova tutte le combinazioni attualmente allineate e pronte per la cottura
        function getMatchingAlignments() {
            const aligned = getAlignedSections();
            const matches = [];
            for (let card of gameState.handCards) {
                for (let sec of aligned) {
                    const matchClay = sec.innerSlot.clay >= card.reqClay;
                    let matchColors = true;
                    for (let [col, reqQty] of Object.entries(card.reqColors)) {
                        if ((sec.combinedColors[col] || 0) < reqQty) matchColors = false;
                    }
                    if (matchClay && matchColors) {
                        matches.push({ card, sec });
                    }
                }
            }
            return matches;
        }
        window.getMatchingAlignments = getMatchingAlignments;

        // --- NUOVO RENDERER SVG TORNIO CON EVIDENZIAZIONE SPICCHI ALLINEATI ---
        function renderPotteryLatheSVG(matches = []) {
            const cx = 150, cy = 150;
            const rOuter = 142, rMid = 76, rHub = 22;

            function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
                const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
                return {
                    x: centerX + (radius * Math.cos(angleInRadians)),
                    y: centerY + (radius * Math.sin(angleInRadians))
                };
            }

            function describeOuterDonutSlice(startAngle, endAngle) {
                const p1 = polarToCartesian(cx, cy, rOuter, startAngle);
                const p2 = polarToCartesian(cx, cy, rOuter, endAngle);
                const p3 = polarToCartesian(cx, cy, rMid, endAngle);
                const p4 = polarToCartesian(cx, cy, rMid, startAngle);
                return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rMid} ${rMid} 0 0 0 ${p4.x} ${p4.y} Z`;
            }

            function describeInnerSlice(startAngle, endAngle) {
                const p1 = polarToCartesian(cx, cy, rMid, startAngle);
                const p2 = polarToCartesian(cx, cy, rMid, endAngle);
                return `M ${cx} ${cy} L ${p1.x} ${p1.y} A ${rMid} ${rMid} 0 0 1 ${p2.x} ${p2.y} Z`;
            }

            // Insieme di spicchi esterni allineati
            const alignedOuterIndices = new Set();
            const alignedInnerIndices = new Set();
            matches.forEach(m => {
                alignedInnerIndices.add(m.sec.innerIndex);
                m.sec.outerIndices.forEach(idx => alignedOuterIndices.add(idx));
            });

            // 1. RUOTA ESTERNA (6 Spicchi Fissi da 60° con 4 Quadratini/Slot ciascuno)
            let outerSVG = '';
            for (let i = 0; i < 6; i++) {
                const startA = i * 60;
                const endA = (i + 1) * 60;
                const midA = startA + 30;
                const slicePath = describeOuterDonutSlice(startA, endA);
                const isAligned = alignedOuterIndices.has(i);
                
                const fillColor = isAligned ? '#42240c' : (i % 2 === 0 ? '#381c08' : '#291404');
                const strokeColor = isAligned ? '#22c55e' : '#8b5a2b';
                const strokeWidth = isAligned ? '3.5' : '2.5';

                // Calcolo pigmenti presenti nello slot
                const slot = gameState.outerSlots[i];
                const activePigments = [];
                for (const [col, count] of Object.entries(slot)) {
                    if (col !== 'id') {
                        for (let c = 0; c < count; c++) activePigments.push(col);
                    }
                }

                // 4 Quadratini Slot disposti ad arco nello spicchio
                let slotsSVG = '';
                const slotRadius = 110;
                const slotOffsets = [-15, -5, 5, 15];
                for (let sIdx = 0; sIdx < 4; sIdx++) {
                    const sPos = polarToCartesian(cx, cy, slotRadius, midA + slotOffsets[sIdx]);
                    const pigmentCol = activePigments[sIdx];
                    if (pigmentCol) {
                        slotsSVG += `
                        <rect x="${sPos.x - 5.5}" y="${sPos.y - 5.5}" width="11" height="11" rx="2.5" 
                              fill="${COLOR_HEX[pigmentCol]}" stroke="#ffffff" stroke-width="1.2" class="drop-shadow-sm"/>
                        `;
                    } else {
                        slotsSVG += `
                        <rect x="${sPos.x - 5}" y="${sPos.y - 5}" width="10" height="10" rx="2" 
                              fill="rgba(0,0,0,0.3)" stroke="${isAligned ? '#4ade80' : '#b48a5c'}" stroke-width="0.9" stroke-dasharray="2,2"/>
                        `;
                    }
                }

                const labelPos = polarToCartesian(cx, cy, 131, midA);

                outerSVG += `
                <g class="${isAligned ? 'lathe-aligned-highlight' : ''}">
                    <path d="${slicePath}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/>
                    <text x="${labelPos.x}" y="${labelPos.y + 3}" text-anchor="middle" fill="${isAligned ? '#4ade80' : '#ffd700'}" font-family="'Cinzel', serif" font-size="8.5" font-weight="bold">#${i + 1}</text>
                    ${slotsSVG}
                </g>
                `;
            }

            // 2. RUOTA INTERNA (3 Spicchi da 120° con Quadratini Argilla: 1 per S1, 2 per S2, 3 per S3)
            let innerSVG = '';
            for (let j = 0; j < 3; j++) {
                const startA = j * 120;
                const endA = (j + 1) * 120;
                const midA = startA + 60;
                const slicePath = describeInnerSlice(startA, endA);
                const isAligned = alignedInnerIndices.has(j);
                
                const fillColor = isAligned ? '#dfb080' : (j % 2 === 0 ? '#d4a373' : '#c59263');
                const strokeColor = isAligned ? '#22c55e' : '#5a320f';
                const strokeWidth = isAligned ? '3.5' : '2.5';

                const slot = gameState.innerSlots[j];
                const capacity = slot.capacity;
                const currentClay = slot.clay;

                let claySlotsSVG = '';
                const clayRadius = 49;
                let offsets = [];
                if (capacity === 1) offsets = [0];
                else if (capacity === 2) offsets = [-14, 14];
                else if (capacity === 3) offsets = [-24, 0, 24];

                for (let k = 0; k < capacity; k++) {
                    const cPos = polarToCartesian(cx, cy, clayRadius, midA + offsets[k]);
                    const isFilled = k < currentClay;
                    if (isFilled) {
                        claySlotsSVG += `
                        <rect x="${cPos.x - 6.5}" y="${cPos.y - 6.5}" width="13" height="13" rx="2.5" 
                              fill="#6b4423" stroke="#2b1406" stroke-width="1.5" class="drop-shadow-sm"/>
                        <rect x="${cPos.x - 4}" y="${cPos.y - 4}" width="8" height="8" rx="1" fill="#8c5830"/>
                        `;
                    } else {
                        claySlotsSVG += `
                        <rect x="${cPos.x - 6}" y="${cPos.y - 6}" width="12" height="12" rx="2" 
                              fill="rgba(255,255,255,0.25)" stroke="${isAligned ? '#166534' : '#5a320f'}" stroke-width="1.2" stroke-dasharray="2,2"/>
                        `;
                    }
                }

                innerSVG += `
                <g class="${isAligned ? 'lathe-aligned-highlight' : ''}">
                    <path d="${slicePath}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/>
                    ${claySlotsSVG}
                </g>
                `;
            }

            return `
            <svg viewBox="0 0 300 300" class="w-full h-full">
                <defs>
                    <radialGradient id="hubGrad" cx="40%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#fde047"/>
                        <stop offset="60%" stop-color="#d97706"/>
                        <stop offset="100%" stop-color="#78350f"/>
                    </radialGradient>
                    <filter id="latheShadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
                    </filter>
                </defs>

                <!-- Bordo Esterno in Legno Scuro -->
                <circle cx="${cx}" cy="${cy}" r="148" fill="#1b0c03" stroke="#8b5a2b" stroke-width="4"/>

                <!-- 1. Ruota Esterna dei Colori (FISSA - 6 Spicchi da 60°) -->
                <g id="svg-lathe-outer">
                    ${outerSVG}
                </g>

                <!-- 2. Ruota Interna dell'Argilla (RUOTA - 3 Spicchi da 120°) -->
                <g id="svg-lathe-inner" class="lathe-inner-disc" style="transform: rotate(${gameState.innerRotationIndex * 120}deg);">
                    ${innerSVG}
                </g>

                <!-- Bordo Separatore Cerchio Medio in Rame Antico -->
                <circle cx="${cx}" cy="${cy}" r="${rMid}" fill="none" stroke="#5a320f" stroke-width="3.5"/>

                <!-- Borchia Centrale in Bronzo con Icona -->
                <circle cx="${cx}" cy="${cy}" r="${rHub}" fill="url(#hubGrad)" stroke="#5a320f" stroke-width="2.5" filter="url(#latheShadow)"/>
                <text x="${cx}" y="${cy + 4.5}" text-anchor="middle" font-size="13">🏺</text>
            </svg>
            `;
        }
        window.renderPotteryLatheSVG = renderPotteryLatheSVG;

        // --- AZIONI DI GIOCO ---

        // Selezione istantanea del garzone
        function selectWorker(workerIndex) {
            if (gameState.workers[workerIndex].busyZone !== null) return;
            
            if (gameState.selectedWorkerIndex === workerIndex) {
                gameState.selectedWorkerIndex = null;
            } else {
                gameState.selectedWorkerIndex = workerIndex;
            }
            renderApp();
        }
        window.selectWorker = selectWorker;

        function handleZoneDirectHelp(zone) {
            if (gameState.selectedWorkerIndex !== null) {
                handleZoneClick(zone);
            } else {
                alert("Seleziona prima uno dei tuoi Garzoni liberi (#1, #2 o #3) per inviarlo in questa zona!");
            }
        }
        window.handleZoneDirectHelp = handleZoneDirectHelp;

        function handleZoneClick(zone) {
            if (gameState.selectedWorkerIndex === null) {
                alert("Seleziona prima uno dei tuoi Garzoni liberi (#1, #2 o #3)!");
                return;
            }

            if (zone === 'river') openRiverModal();
            else if (zone === 'market') openMarketModal();
            else if (zone === 'plaza') openPlazaModal();
            else if (zone === 'workshop') openWorkshopAction();
            else if (zone === 'oven') openOvenAction();
        }
        window.handleZoneClick = handleZoneClick;

        function markWorkerBusy(zoneName) {
            if (gameState.selectedWorkerIndex !== null) {
                gameState.workers[gameState.selectedWorkerIndex].busyZone = zoneName;
                gameState.selectedWorkerIndex = null;

            }
        }
        window.markWorkerBusy = markWorkerBusy;

        // 1. FIUME: Distribuzione completa Argilla
        let riverClayTotal = 2;
        let riverClayAllocated = [0, 0, 0];

        function openRiverModal() {
            const modal = document.getElementById('game-action-modal');
            const title = document.getElementById('modal-title');
            riverClayTotal = 2;
            riverClayAllocated = [0, 0, 0];

            title.innerHTML = "🌊 Fiume: Raccolta Argilla";
            renderRiverBody();
            modal.classList.remove('hidden');
        }
        window.openRiverModal = openRiverModal;

        function setRiverOption(amount) {
            if (amount === 3) {
                if (gameState.coins < 1) {
                    alert("Non hai abbastanza monete per il barchino (serve 1 💰)!");
                    return;
                }
            }
            riverClayTotal = amount;
            riverClayAllocated = [0, 0, 0];
            renderRiverBody();

        window.setRiverOption = setRiverOption;

        function renderRiverBody() {
            const content = document.getElementById('modal-content');
            const currentlyAllocated = riverClayAllocated.reduce((a, b) => a + b, 0);

                    </button>
                    <button onclick="setRiverOption(3)" class="p-2 rounded-xl border-2 text-center font-bold ${riverClayTotal === 3 ? 'border-amber-600 bg-amber-50 text-amber-900' : 'border-gray-200 bg-white'}">
                        Barchino: <b>3 Argille</b> (💰 1 Moneta)

                </div>

                <div class="p-2.5 bg-blue-50/70 border border-blue-200 rounded-xl text-center">
                    <span class="font-bold text-gray-700">Argilla da posizionare sul Tornio: </span>
                    <b class="text-sm text-blue-800">${remainingToPlace} / ${riverClayTotal} 🧱</b>
                </div>

                <!-- Distribuzione nei 3 Settori Interni con quadratini visuali -->
                <div class="grid grid-cols-3 gap-2">
                    ${gameState.innerSlots.map((slot, idx) => {
                        const existing = slot.clay;
                        const added = riverClayAllocated[idx];
                        const totalInSlot = existing + added;
                        const canAdd = remainingToPlace > 0 && totalInSlot < slot.capacity;
                        const canRemove = added > 0;

                        return `
                        <div class="p-2.5 rounded-xl border-2 bg-white flex flex-col items-center justify-between border-amber-300">
                            <span class="font-bold text-amber-900 font-serif">Spicchio ${idx + 1}</span>
                            <span class="text-[0.65rem] text-gray-500">Capacità: ${slot.capacity} 🧱</span>
                            
                            <div class="my-2 flex gap-1 justify-center">
                                ${Array(slot.capacity).fill(0).map((_, sIdx) => {
                                    const filled = sIdx < totalInSlot;
                                    return filled ? 
                                        '<span class="w-4 h-4 bg-amber-900 border border-amber-950 rounded-xs shadow-xs inline-block"></span>' :
                                        '<span class="w-4 h-4 bg-gray-100 border border-dashed border-gray-400 rounded-xs inline-block"></span>';
                                }).join('')}
                            </div>

                            <div class="flex gap-1.5">
                                <button onclick="modRiverClay(${idx}, -1)" ${!canRemove ? 'disabled' : ''} class="w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-30 font-bold">-</button>
                                <button onclick="modRiverClay(${idx}, 1)" ${!canAdd ? 'disabled' : ''} class="w-6 h-6 rounded bg-amber-500 hover:bg-amber-600 disabled:opacity-30 text-white font-bold">+</button>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>

                <button onclick="confirmRiverPlacement()" ${remainingToPlace > 0 ? 'disabled' : ''}
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow transition">
                    Conferma e Posiziona
                </button>
            </div>
            `;
        }
        window.renderRiverBody = renderRiverBody;

        window.modRiverClay = function(idx, delta) {
            riverClayAllocated[idx] += delta;
            renderRiverBody();
        };

        window.confirmRiverPlacement = function() {
            if (riverClayTotal === 3) gameState.coins--;
            
            gameState.innerSlots.forEach((slot, idx) => {
                slot.clay += riverClayAllocated[idx];
            });

            closeActionModal();
            markWorkerBusy('Fiume');
        };

        // 2. MERCATO DEI PIGMENTI
        let marketMode = 2;
        let marketItemsToPlace = [];
        let currentItemIndex = 0;
        let marketPlacements = [];

        function openMarketModal() {
            const modal = document.getElementById('game-action-modal');
            const title = document.getElementById('modal-title');
            marketMode = 2;
            marketItemsToPlace = [];
            currentItemIndex = 0;
            marketPlacements = [];

            title.innerHTML = "🎨 Mercato dei Pigmenti";
            renderMarketBody();
            modal.classList.remove('hidden');
        }
        window.openMarketModal = openMarketModal;

        function setMarketMode(mode) {
            marketMode = mode;
            marketItemsToPlace = [];
            currentItemIndex = 0;
            marketPlacements = [];
            renderMarketBody();
        }
        window.setMarketMode = setMarketMode;

        function renderMarketBody() {
            const content = document.getElementById('modal-content');
            const cost = marketMode === 2 ? 1 : 2;
            const canAfford = gameState.coins >= cost;

            if (marketItemsToPlace.length < marketMode) {
                content.innerHTML = `
                <div class="space-y-3 text-xs select-none">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setMarketMode(2)" class="p-2 rounded-xl border-2 text-center font-bold ${marketMode === 2 ? 'border-purple-600 bg-purple-50 text-purple-900' : 'border-gray-200 bg-white'}">
                            Piccolo: <b>2 Colori</b> (💰 1 Moneta)
                        </button>
                        <button onclick="setMarketMode(3)" class="p-2 rounded-xl border-2 text-center font-bold ${marketMode === 3 ? 'border-purple-600 bg-purple-50 text-purple-900' : 'border-gray-200 bg-white'}">
                            Grande: <b>3 Colori</b> (💰 2 Monete)
                        </button>
                    </div>

                    <div class="p-2 bg-purple-50 border border-purple-200 rounded-xl flex justify-between items-center">
                        <span class="font-bold text-purple-950">Scegli i colori (${marketItemsToPlace.length}/${marketMode})</span>
                        <span class="font-bold text-amber-700">Saldo: ${gameState.coins} 💰</span>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5">
                        ${COLORS.map(c => {
                            const count = marketItemsToPlace.filter(x => x === c).length;
                            return `
                            <button onclick="addMarketColorToPack('${c}')" class="p-2 rounded-lg border bg-white hover:bg-gray-50 flex items-center justify-between font-bold border-gray-200">
                                <span class="w-4 h-4 rounded-full border shadow-sm" style="background-color: ${COLOR_HEX[c]}"></span>
                                <span>${getColorName(c)}</span>
                                <span class="text-purple-700 font-bold">${count ? '+' + count : ''}</span>
                            </button>
                            `;
                        }).join('')}
                    </div>

                    ${marketItemsToPlace.length > 0 ? `
                    <div class="flex justify-between items-center text-[0.65rem] text-gray-500">
                        <span>Selezionati: ${marketItemsToPlace.map(c => getColorName(c)).join(', ')}</span>
                        <button onclick="resetMarketPack()" class="text-red-500 underline font-bold">Azzera</button>
                    </div>
                    ` : ''}
                </div>
                `;
            } else {
                const currentColor = marketItemsToPlace[currentItemIndex];
                content.innerHTML = `
                <div class="space-y-3 text-xs select-none">
                    <div class="p-2.5 bg-purple-50 border border-purple-300 rounded-xl text-center">
                        <span class="text-xs font-bold text-purple-950 block">Posizionamento Colore ${currentItemIndex + 1} di ${marketMode}:</span>
                        <div class="inline-flex items-center gap-2 mt-1 px-3 py-1 bg-white rounded-full border border-purple-200 shadow-sm">
                            <span class="w-4 h-4 rounded-full" style="background-color: ${COLOR_HEX[currentColor]}"></span>
                            <b class="text-sm text-purple-900">${getColorName(currentColor)}</b>
                        </div>
                    </div>

                    <p class="text-gray-700 text-center font-medium">Clicca sullo spicchio esterno (#1 - #6) dove posizionare questo colore:</p>

                    <div class="grid grid-cols-3 gap-2">
                        ${gameState.outerSlots.map((s, idx) => {
                            const newlyPlacedForThisSlot = marketPlacements.filter(p => p.targetSector === idx);
                            
                            // Lista pigmenti esistenti
                            const existingList = [];
                            for (const [col, qty] of Object.entries(s)) {
                                if (col !== 'id') {
                                    for (let q = 0; q < qty; q++) existingList.push(col);
                                }
                            }
                            const totalColorsInSlot = existingList.length + newlyPlacedForThisSlot.length;
                            const canPlaceHere = totalColorsInSlot < 4;

                            return `
                            <button onclick="${canPlaceHere ? `placeCurrentColorInSector(${idx})` : 'alert(\'Spicchio pieno (max 4 colori)!\')'}" 
                                class="p-3 rounded-xl border-2 bg-white hover:bg-purple-50 border-purple-300 flex flex-col items-center justify-between shadow-sm transition active:scale-95 ${!canPlaceHere ? 'opacity-50 cursor-not-allowed' : ''}">
                                <span class="font-serif font-bold text-xs text-purple-950">Spicchio #${idx + 1}</span>
                                
                                <!-- 4 Quadratini Slot -->
                                <div class="grid grid-cols-4 gap-1 my-2 justify-center">
                                    ${Array(4).fill(0).map((_, slIdx) => {
                                        if (slIdx < existingList.length) {
                                            return `<span class="w-3.5 h-3.5 rounded-xs border shadow-xs" style="background-color: ${COLOR_HEX[existingList[slIdx]]}"></span>`;
                                        } else if (slIdx < existingList.length + newlyPlacedForThisSlot.length) {
                                            const newlyAdded = newlyPlacedForThisSlot[slIdx - existingList.length];
                                            return `<span class="w-3.5 h-3.5 rounded-xs border-2 border-yellow-400 animate-pulse" style="background-color: ${COLOR_HEX[newlyAdded.color]}"></span>`;
                                        } else {
                                            return '<span class="w-3.5 h-3.5 rounded-xs border border-dashed border-gray-300 bg-gray-50"></span>';
                                        }
                                    }).join('')}
                                </div>

                                <span class="text-[0.6rem] text-purple-700 font-bold bg-purple-100 px-2 py-0.5 rounded">${canPlaceHere ? 'Metti qui' : 'Pieno (4/4)'}</span>
                            </button>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }
        }
        window.renderMarketBody = renderMarketBody;

        window.addMarketColorToPack = function(col) {
            if (marketItemsToPlace.length < marketMode) {
                marketItemsToPlace.push(col);
                if (marketItemsToPlace.length === marketMode) {
                    currentItemIndex = 0;
                    marketPlacements = [];
                }
                renderMarketBody();
            }
        };

        window.resetMarketPack = function() {
            marketItemsToPlace = [];
            currentItemIndex = 0;
            marketPlacements = [];
            renderMarketBody();
        };

        window.placeCurrentColorInSector = function(sectorIdx) {
            const currentColor = marketItemsToPlace[currentItemIndex];
            marketPlacements.push({ color: currentColor, targetSector: sectorIdx });
            
            currentItemIndex++;
            if (currentItemIndex < marketMode) {
                renderMarketBody();
            } else {
                executeFinalMarketPlacement();
            }
        };

        function executeFinalMarketPlacement() {
            const cost = marketMode === 2 ? 1 : 2;
            gameState.coins -= cost;

            marketPlacements.forEach(p => {
                const slot = gameState.outerSlots[p.targetSector];
                slot[p.color] = (slot[p.color] || 0) + 1;
            });

            closeActionModal();
            markWorkerBusy('Mercato');
        }

        // 3. PIAZZA (Carte Opera)
        function openPlazaModal() {
            const modal = document.getElementById('game-action-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const canTake = gameState.handCards.length < 3;

            title.innerHTML = "📜 Piazza: Vetrina Commissioni";
            content.innerHTML = `
            <div class="space-y-3 text-xs">
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 font-medium">Scegli 1 Carta Opera per la tua mano:</span>
                    <button onclick="refreshPlazaCards()" ${gameState.coins < 1 ? 'disabled' : ''} class="text-[0.65rem] font-bold text-amber-700 bg-amber-100 px-2 py-1 rounded border border-amber-300 disabled:opacity-40">
                        🔄 Rinnova Vetrina (💰 1)
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    ${gameState.plazaDisplay.map((card, idx) => `

                                <div>
                                    <div class="font-bold text-[0.7rem] text-blue-900 uppercase leading-tight">${card.name}</div>
                                    <div class="flex flex-wrap gap-1 mt-1 text-[0.6rem]">
                                        <span class="bg-stone-200 text-stone-800 px-1 py-0.5 rounded font-bold">🧱 ${card.reqClay}</span>
                                        ${Object.entries(card.reqColors).map(([col, qty]) => `
                                            <span class="px-1 py-0.5 rounded text-white font-bold" style="background-color: ${COLOR_HEX[col]}">
                                                ${qty} ${getColorName(col).substring(0,3)}

                                        `).join('')}
                                    </div>
                                    <div class="flex gap-2 font-bold mt-1 text-[0.65rem]">
                                        <span class="text-amber-600">💰 ${card.rewardMoney}</span>
                                        <span class="text-yellow-600">🏆 ${card.rewardPoints} Pti</span>
                                    </div>
                                </div>
                            </div>

                            <button onclick="takePlazaCard(${idx})" ${!canTake ? 'disabled' : ''}
                                class="w-full py-1.5 bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold rounded-lg text-xs transition">
                                ${canTake ? 'Prendi Carta' : 'Mano Piena'}
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>
            `;
            modal.classList.remove('hidden');
        }
        window.openPlazaModal = openPlazaModal;

        window.takePlazaCard = function(idx) {
            if (gameState.handCards.length >= 3) return;
            const chosen = gameState.plazaDisplay.splice(idx, 1)[0];
            gameState.handCards.push(chosen);

            const remaining = ALL_COMMISSIONS.filter(c => 
                !gameState.handCards.some(h => h.id === c.id) && 
                !gameState.plazaDisplay.some(p => p.id === c.id)
            );
            if (remaining.length > 0) {
                gameState.plazaDisplay.push(remaining[Math.floor(Math.random() * remaining.length)]);
            }

            closeActionModal();
            markWorkerBusy('Piazza');
        };

        window.refreshPlazaCards = function() {
            if (gameState.coins < 1) return;
            gameState.coins--;
            const available = ALL_COMMISSIONS.filter(c => !gameState.handCards.some(h => h.id === c.id));
            gameState.plazaDisplay = available.sort(() => 0.5 - Math.random()).slice(0, 4);
            openPlazaModal();
            renderApp();
        };

        // 4. BOTTEGHE: SBLOCCA LE MOSSE DEL TORNIO
        function openWorkshopAction() {
            gameState.rotationActions += 3;
            markWorkerBusy('Bottega');

            const modal = document.getElementById('game-action-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            title.innerHTML = "🏺 Botteghe: Attivazione Tornio";
            content.innerHTML = `
            <div class="space-y-3 text-xs text-center py-2 select-none">
                <div class="p-3 bg-amber-50 border border-amber-300 rounded-xl">
                    <span class="text-3xl inline-block animate-bounce mb-1">🏺✨</span>
                    <h4 class="text-sm font-bold text-amber-900 font-serif">Garzone Assegnato alle Botteghe!</h4>
                    <p class="text-xs text-amber-800 mt-1">
                        Hai sbloccato <b>3 Mosse Tornio</b> per ruotare l'argilla e allineare le tue opere d'arte.
                    </p>
                </div>
                <p class="text-[0.7rem] text-gray-600">
                    Usa il pulsante <b>🔄 Ruota Disco Argilla</b> sul pannello di destra per allineare l'argilla con i pigmenti colorati desiderati!
                </p>
            </div>
            `;
            modal.classList.remove('hidden');
        }
        window.openWorkshopAction = openWorkshopAction;

        // 5. FORNO: COTTURA DI OPERE ALLINEATE
        function openOvenAction() {
            const modal = document.getElementById('game-action-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const matches = getMatchingAlignments();

            title.innerHTML = "🔥 Il Grande Forno: Cottura Opere Allineate";

            if (matches.length > 0) {
                content.innerHTML = `
                <div class="space-y-3 text-xs">
                    <div class="p-2.5 bg-green-50 border border-green-300 rounded-xl text-center">
                        <span class="text-3xl inline-block animate-bounce mb-1">🏺✨</span>
                        <h4 class="text-sm font-bold text-green-800 font-serif">Opere Pronte per la Cottura!</h4>
                        <p class="text-[0.65rem] text-gray-600">I materiali sul tornio sono allineati correttamente per completare queste opere:</p>
                    </div>

                    <div class="space-y-2">
                        ${matches.map(m => {
                            const cardIdx = gameState.handCards.findIndex(c => c.id === m.card.id);
                            return `
                            <div class="p-3 bg-white border-2 border-green-500 rounded-xl shadow-sm flex items-center justify-between gap-3">
                                <img src="${m.card.img}" alt="${m.card.name}" class="w-12 h-12 object-cover rounded-lg border bg-gray-50 flex-shrink-0">
                                
                                <div class="flex-grow">
                                    <div class="font-bold text-xs text-blue-950 uppercase">${m.card.name}</div>
                                    <div class="text-[0.65rem] text-gray-600">
                                        Allineata su <b>${m.sec.innerSlot.name}</b> (Spicchi Colori #${m.sec.outerIndices[0] + 1} & #${m.sec.outerIndices[1] + 1})
                                    </div>
                                    <div class="text-green-700 font-bold mt-0.5">
                                        +💰 ${m.card.rewardMoney} Monete | +🏆 ${m.card.rewardPoints} Punti Prestigio
                                    </div>
                                </div>

                                <button onclick="executeBakeArtwork(${cardIdx}, ${m.sec.innerIndex})" class="py-2 px-3 bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold rounded-xl text-xs shadow transition flex-shrink-0">
                                    🔥 Inforna!
                                </button>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            } else {
                const aligned = getAlignedSections();
                content.innerHTML = `
                <div class="space-y-3 py-1 text-xs select-none">
                    <div class="p-3 bg-red-50 border-2 border-red-300 rounded-xl text-center">
                        <span class="text-3xl inline-block mb-1">⚠️</span>
                        <h4 class="text-sm font-bold text-red-900 font-serif">Nessuna Opera Pronta per la Cottura!</h4>
                        <p class="text-xs text-red-800 mt-1">
                            Non puoi finalizzare l'opera: i materiali sul tornio non corrispondono ai requisiti delle carte che hai in mano.
                        </p>
                        <p class="text-[0.7rem] text-gray-700 mt-2 font-medium">
                            💡 <b>Il tuo Garzone non è stato usato!</b> Invia un Garzone alle <b>Botteghe</b> per ruotare l'argilla sul tornio o al <b>Mercato</b> per comprare i colori mancanti.
                        </p>
                    </div>

                    <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-center">
                        <div class="font-bold text-amber-900 mb-1 font-serif text-[0.7rem]">Allineamento Attuale del Tornio:</div>
                        <div class="space-y-1 text-[0.65rem] text-left max-w-sm mx-auto">
                            ${aligned.map(sec => `
                                <div class="p-1.5 bg-white rounded border border-amber-200 flex justify-between items-center">
                                    <span class="font-bold text-amber-900">${sec.innerSlot.name} (🧱 ${sec.innerSlot.clay}):</span>
                                    <span>Colori #${sec.outerIndices[0] + 1} & #${sec.outerIndices[1] + 1}: ${Object.entries(sec.combinedColors).filter(([_, q]) => q > 0).map(([c, q]) => `<span class="px-1 rounded text-white font-bold" style="background:${COLOR_HEX[c]}">${q}${getColorName(c).substring(0,2)}</span>`).join(' ') || '∅'}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                `;
            }

            modal.classList.remove('hidden');
        }
        window.openOvenAction = openOvenAction;

        window.executeBakeArtwork = function(cardIdx, innerSectorIdx) {
            const card = gameState.handCards[cardIdx];
            const aligned = getAlignedSections();
            const sec = aligned.find(s => s.innerIndex === innerSectorIdx);

            if (!sec) return;

            sec.innerSlot.clay -= card.reqClay;

            for (let [col, qtyNeeded] of Object.entries(card.reqColors)) {
                let remaining = qtyNeeded;
                const from1 = Math.min(sec.outerSlots[0][col] || 0, remaining);
                sec.outerSlots[0][col] -= from1;
                remaining -= from1;

                if (remaining > 0) {
                    const from2 = Math.min(sec.outerSlots[1][col] || 0, remaining);
                    sec.outerSlots[1][col] -= from2;
                }
            }

            gameState.coins += card.rewardMoney;
            gameState.handCards.splice(cardIdx, 1);

            closeActionModal();
            markWorkerBusy('Forno');

            // --- ANIMAZIONE MORBIDA E RILASSATA DELL'ASINELLO (PASSO-PASSO DA 800ms) ---
            const pointsToGain = card.rewardPoints;
            const startScore = gameState.score;
            const finalScore = Math.min(15, startScore + pointsToGain);

            gameState.isDonkeyWalking = true;
            gameState.isScoreCelebrating = true;
            gameState.scoringToastMessage = `+${card.rewardMoney} 💰 Monete | +${pointsToGain} 🏆 Punti Prestigio (Guarda l'Asinello!)`;
            
            if (typeof window.scrollTo === 'function') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            renderApp();

            let currentStepScore = startScore;
            const stepTimer = setInterval(() => {
                if (currentStepScore < finalScore) {
                    currentStepScore++;
                    gameState.score = currentStepScore;
                    
                    updateScoreDOMDirectly(currentStepScore, true);
                } else {
                    clearInterval(stepTimer);
                    gameState.isDonkeyWalking = false;
                    updateScoreDOMDirectly(finalScore, false);

                    setTimeout(() => {
                        gameState.isScoreCelebrating = false;
                        gameState.scoringToastMessage = null;
                        renderApp();
                    }, 2200);
                }
            }, 800); // 800ms per step
        };

        // Aggiorna selettivamente il tracciato punti (0-15)
        function updateScoreDOMDirectly(newScore, isWalking) {
            const scoreDisplay = document.getElementById('score-display-val');
            if (scoreDisplay) scoreDisplay.innerText = newScore;

            for (let i = 0; i <= 15; i++) {
                const tile = document.getElementById('score-tile-' + i);
                if (!tile) continue;
                
                const holder = tile.querySelector('.tile-donkey-holder');
                const num = tile.querySelector('.tile-number');

                if (i === newScore) {
                    tile.classList.add('active-score', 'border-yellow-500');
                    tile.classList.remove('border-blue-200');
                    if (holder) holder.innerHTML = getDonkeySVG(22, isWalking);
                    if (num) num.classList.add('text-yellow-900', 'font-black');

                    tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    tile.classList.remove('active-score', 'border-yellow-500');
                    tile.classList.add('border-blue-200');
                    if (holder) holder.innerHTML = '<span class="text-[0.55rem] text-gray-300">·</span>';
                    if (num) num.classList.remove('text-yellow-900', 'font-black');
                }
            }

            const statusText = document.getElementById('donkey-status-text');
            if (statusText) {
                if (isWalking) statusText.classList.remove('hidden');
                else statusText.classList.add('hidden');
            }
        }

        function rotateInnerClockwise() {
            if (gameState.rotationActions <= 0) {
                alert("🔒 Il tornio è fermo! Devi prima inviare un Garzone alle Botteghe per sbloccare le mosse tornio.");
                return;
            }
            gameState.rotationActions--;
            gameState.innerRotationIndex = (gameState.innerRotationIndex + 1) % 3;
            gameState.isLatheSpinning = true;
            renderApp();
            
            setTimeout(() => {
                gameState.isLatheSpinning = false;
                renderApp();
            }, 650);
        }
        window.rotateInnerClockwise = rotateInnerClockwise;

        function endRound() {
            gameState.workers.forEach(w => w.busyZone = null);
            gameState.selectedWorkerIndex = null;
            gameState.rotationActions = 0;
            gameState.currentDay = Math.min(gameState.maxDays, gameState.currentDay + 1);
            alert("🌙 Fine Giornata! I 3 garzoni sono tornati a riposare.");
            renderApp();
        }
        window.endRound = endRound;

        function resetEntireGame() {
            const newCards = getRandomDeckSetup();
            gameState.handCards = newCards.hand;
            gameState.plazaDisplay = newCards.plaza;
            gameState.score = 0;
            gameState.coins = 5;
            gameState.innerSlots.forEach(s => s.clay = 0);
            gameState.outerSlots.forEach(s => {
                COLORS.forEach(c => s[c] = 0);
            });
            gameState.workers.forEach(w => w.busyZone = null);
            gameState.selectedWorkerIndex = null;
            gameState.currentDay = 1;
            gameState.rotationActions = 0;
            gameState.innerRotationIndex = 0;
            alert("🎲 Nuova Partita avviata con Carte Commissione e Vetrina estratte a caso!");
            renderApp();
        }
        window.resetEntireGame = resetEntireGame;

        function closeActionModal() {
            document.getElementById('game-action-modal').classList.add('hidden');
            renderApp();
        }
        window.closeActionModal = closeActionModal;

        // Init
        renderApp();
        window.onload = () => renderApp();
        document.addEventListener('DOMContentLoaded', () => renderApp());
    </script>
</body>
</html>
